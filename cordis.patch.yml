# dsh-pairing-gate — 前台 HTTPS 认证网关（扫码设备验证 + 用户名密码 + TOTP）。
#
# 本文件由插件包通过 dsh.profile.bundles / dsh.bundle.patch 提供给 profile。
# 安装（本轮不执行，需用户自行安排）：
#   dsh plugin --profile web add link:$PLUGIN_DIR
# 或在 profile 的 cordis.patch.yml（$DSH_HOME/profiles/web/cordis.patch.yml）里
# 直接追加下面这段 insert；随后重启 dsh。
#
# v0.6.0：管理页「网络设置」写入的 $DSH_HOME/auth-gate/network.json 会在启动时覆盖
# 下面的 listenHost/listenPort/publicUrl（其它字段仍以本文件为准）；删除该文件并重启
# 即可回退到这里的默认值。
#
# 安全提示：
#   - listenHost 必须是具体网卡地址，不支持 0.0.0.0/::；只暴露给需要访问的网段。
#   - upstream 当前为 dsh 原生 HTTPS（自签证书），因此 upstreamInsecureTls 为 true；
#     若 dsh 改回明文 HTTP，请同步修改 upstream / publicUrl / tls*。
#   - 首次启动会在 $DSH_HOME/auth-gate/admin.key 生成 32 字节 hex 管理密钥（0600），
#     并在日志打印一次；请立即保存到密码管理器。
- insert:
    - id: auth-gate
      name: 'dsh-pairing-gate'
      config:
        listenHost: 172.16.180.14
        listenPort: 3443
        upstream: https://172.16.180.14:3080
        upstreamInsecureTls: true
        publicUrl: https://172.16.180.14:3443
        tlsCert: /opt/deepseekharness/config/tls/dsh.crt.pem
        tlsKey: /opt/deepseekharness/config/tls/dsh.key.pem
        adminKeyFile: $DSH_HOME/auth-gate/admin.key
        stateDir: $DSH_HOME/auth-gate
        sessionTtlHours: 48
        sessionAbsoluteTtlDays: 30
        deviceTtlDays: 90
        deviceAbsoluteTtlDays: 365
        maxDevices: 8
        pairTicketTtlSeconds: 120
        loginLock:
          maxFailures: 5
          windowMinutes: 15
          lockMinutes: 15
